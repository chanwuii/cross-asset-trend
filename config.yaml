# ---------------------------------------------------------------
# Cross-asset trend following (mini-CTA) - configuration
# Change numbers here instead of editing the code.
# ---------------------------------------------------------------

# Risky assets the strategy can hold (liquid US-listed ETFs).
universe:
  SPY: US large-cap stocks
  QQQ: US tech / Nasdaq-100
  EFA: Developed ex-US stocks
  EEM: Emerging-market stocks
  VNQ: US real estate (REITs)
  TLT: US Treasuries 20y+
  IEF: US Treasuries 7-10y
  GLD: Gold
  DBC: Broad commodities
  UUP: US dollar index

# Money parked in "cash" earns the return of this T-bill ETF.
# (Before it existed, cash earns 0%.)
cash_ticker: BIL

data:
  start: "2005-01-01"      # download start (extra history for lookbacks)
  end: null                # null = up to today
  cache_path: data/prices.csv

backtest:
  start: "2007-06-01"      # first day we evaluate performance
  initial_capital: 100000
  cost_bps: 5              # one-way cost per unit of turnover (5 bps = 0.05%)
  in_sample_end: "2018-12-31"   # everything after this is out-of-sample

signal:
  momentum_lookback_months: 12  # "is the asset up over the past N months?"
  skip_months: 0                # optionally skip the most recent month
  sma_window: 200               # "is the price above its 200-day average?"
  kind: default                 # "default" or "your_turn" (see signals.py)

sizing:
  vol_lookback_days: 63    # ~3 months of daily returns to estimate risk
  target_vol: 0.10         # aim for 10% annual portfolio volatility
  max_weight: 0.30         # no single ETF above 30% of the portfolio
  max_gross: 1.0           # no leverage: total invested <= 100%

benchmarks:
  spy_ticker: SPY
  sixty_forty: {SPY: 0.6, IEF: 0.4}

sensitivity:
  momentum_lookback_months: [3, 6, 12]
  sma_window: [100, 200]

# Stage 2: Google Trends attention overlay
trends:
  enabled: true
  cache_path: data/trends_monthly.csv
  timeframe: "2004-01-01 {today}"
  short_months: 3          # recent attention window
  long_months: 12          # baseline attention window
  lag_months: 1            # only use months that were complete before the rebalance
  threshold: 0.20          # ratio must move +/-20% vs baseline to count
  tilt: 0.25               # scale weight up/down by 25%
  keywords:
    SPY: stock market
    QQQ: nasdaq
    EFA: european stocks
    EEM: emerging markets
    VNQ: REIT
    TLT: treasury bonds
    IEF: bond yields
    GLD: gold price
    DBC: commodities
    UUP: dollar index

# ===============================================================
# v2 (default run): multi-speed ensemble + carry A/B
# The v1 settings above (signal / sensitivity / trends) are kept so
# `python run.py --v1` reproduces the original results in output/v1/.
# ===============================================================
ensemble:
  speeds_months: [1, 3, 6, 12]   # equal weight 1/4 each, fixed in advance
  skip_months: 0                 # no skip at any speed (see ensemble.py)

carry:
  enabled: true
  agree: 1.25                    # pre-specified, NOT tuned
  disagree: 0.75
  start: "2005-01-01"
  short_rate: ^IRX               # 13-week T-bill yield (percent)
  equities: [SPY, QQQ, EFA, EEM, VNQ]
  bonds: {TLT: ^TYX, IEF: ^TNX}  # 30y yield for TLT (20y+), 10y for IEF (7-10y)
  fx:
    asset: UUP
    us_series: IRSTCI01USM156N   # OECD immediate (overnight) rates, monthly, FRED
    publication_lag_months: 1    # month M treated as known from start of month M+2
    foreign:                     # DXY weights, renormalised over these four
      EUR: {series: IRSTCI01DEM156N, weight: 57.6}   # Germany as euro-area proxy
      JPY: {series: IRSTCI01JPM156N, weight: 13.6}
      GBP: {series: IRSTCI01GBM156N, weight: 11.9}
      CAD: {series: IRSTCI01CAM156N, weight: 9.1}
  skipped:
    DBC: "roll yield needs expired futures prices - not available from Yahoo (TODO)"
    GLD: "physical gold, no roll; lease-rate data not available (see YOUR TURN)"
  rates_cache: data/carry_rates.csv
  raw_close_cache: data/carry_raw_close.csv
  dividends_cache: data/carry_dividends.csv
  fred_cache: data/carry_fred_monthly.csv
